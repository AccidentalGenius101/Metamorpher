[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamorpher-control"
version = "0.1.0"
description = "Reference controller for frontier-constrained, evidence-revising agent control"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Gabriel Aubin-Moreau"}]
maintainers = [{name = "Gabriel Aubin-Moreau"}]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
cuda = ["torch>=2.4", "triton>=3.0", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
metamorpher = "metamorpher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
