name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[numpy]"
      - name: Unit and property tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src examples benchmarks
      - name: Diagnose optional backends
        run: metamorpher doctor --json
      - name: Run Sierra simulation
        run: metamorpher demo sierra --json
      - name: Verify CPU backend parity
        run: python benchmarks/benchmark_backends.py --backend numpy --batch 32 --actions 24 --repeats 2 --json
